name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after both native builds and update tests pass (main only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac --arm64
          - os: windows-latest
            platform: win
            args: --win --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        shell: bash
        run: |
          node --input-type=module -e "import p from './package.json' with {type:'json'}; if (process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+p.version) process.exit(1)"
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - name: Package desktop application
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Test packaged macOS application
        if: matrix.platform == 'mac'
        shell: bash
        run: NEARLINK_EXECUTABLE="$PWD/release/mac-arm64/Nearlink.app/Contents/MacOS/Nearlink" npm run smoke
      - name: Test packaged Windows application
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $env:NEARLINK_EXECUTABLE = (Resolve-Path 'release/win-unpacked/Nearlink.exe').Path
          npm run smoke
      - name: Test real application update and restart
        env:
          NEARLINK_UPDATE_PRIVATE_KEY: ${{ secrets.NEARLINK_UPDATE_PRIVATE_KEY }}
        run: npm run smoke:update
      - uses: actions/upload-artifact@v7
        with:
          name: nearlink-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-release-${{ matrix.platform }}
          path: |
            .smoke/**/electron.log
            .smoke/**/result.json
            .smoke/**/chat.png
            .smoke/**/helper.log
            .smoke/**/helper-error.log
            .smoke/**/relaunch.log
            .smoke/**/launch.log
            .smoke/**/update-ready.png
          include-hidden-files: true
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: nearlink-*
          merge-multiple: true
          path: dist
      - name: Sign update manifest
        env:
          NEARLINK_UPDATE_PRIVATE_KEY: ${{ secrets.NEARLINK_UPDATE_PRIVATE_KEY }}
        run: npm run manifest -- dist
      - name: Create checksums
        working-directory: dist
        run: sha256sum Nearlink-* update.json update.json.sig > SHA256SUMS.txt
      - name: Publish release with both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args=(--verify-tag)
          else
            args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" "${args[@]}" --title "Nearlink $tag · 邻线" --notes-file "docs/releases/$tag.md"
